# Tests on every push and pull request, on Windows (where the tool runs) and Linux.
# Builds BadPwdLookup.exe on Windows every time, and on a version tag (v3.1.0, ...)
# publishes it as a GitHub pre-release. Mark it "latest" by hand once it's been tried
# against real domain controllers.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # Both runners ship pwsh, so the PowerShell tests run too
      - run: python -m pytest -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name BadPwdLookup badpwd_lookup.py
      - name: Check the exe was built
        shell: pwsh
        run: |
          $exe = Get-Item dist/BadPwdLookup.exe
          "{0} ({1:N1} MB)" -f $exe.Name, ($exe.Length / 1MB)
          (Get-FileHash $exe -Algorithm SHA256).Hash | Tee-Object dist/BadPwdLookup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BadPwdLookup
          path: |
            dist/BadPwdLookup.exe
            dist/BadPwdLookup.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BadPwdLookup
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          BadPwdLookup.exe BadPwdLookup.exe.sha256
          --repo "$GITHUB_REPOSITORY"
          --title "Bad Password Lookup $GITHUB_REF_NAME"
          --prerelease
          --generate-notes
